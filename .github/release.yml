# Sections for the release notes GitHub generates (the Release workflow drafts them when a tag is pushed).
# Each merged pull request goes into the first section whose label it has. Pull requests without any of
# these labels end up under "Other changes".
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: New features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Accessibility
      labels:
        - accessibility
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - maintenance
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - '*'
