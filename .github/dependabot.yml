# Monthly dependency updates, grouped so each ecosystem opens at most one pull request for routine updates.
# Security fixes still arrive as their own pull requests once Dependabot security updates are turned on.
# Every pull request gets just the dependencies label, which puts it under Dependencies in the release notes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    labels: [dependencies]
    schedule:
      interval: monthly
    groups:
      # Tauri's JavaScript packages should move together with the Rust crates of the same version.
      tauri:
        patterns: ['@tauri-apps/*']
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    labels: [dependencies]
    schedule:
      interval: monthly
    groups:
      tauri:
        patterns: ['tauri*']
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    labels: [dependencies]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # The Android project is generated by Tauri, so only take minor and patch updates here. Major Gradle or
  # Android plugin upgrades are better taken from a newer Tauri template.
  - package-ecosystem: gradle
    directory: /src-tauri/gen/android
    labels: [dependencies]
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      android:
        patterns: ['*']
