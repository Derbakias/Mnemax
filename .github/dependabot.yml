# Monthly dependency updates, grouped so each ecosystem opens at most one pull request for routine updates.
# Security fixes still arrive as their own pull requests once Dependabot security updates are turned on.
# Every pull request gets just the dependencies label, which puts it under Dependencies in the release notes.
# The Android project (src-tauri/gen/android) is left out on purpose: it's generated by Tauri, and its library
# versions have to match the Kotlin version Tauri's template uses. See Dependabot in MAINTAINING.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    labels: [dependencies]
    schedule:
      interval: monthly
    groups:
      # Tauri's JavaScript packages should move together with the Rust crates of the same version.
      tauri:
        patterns: ['@tauri-apps/*']
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    labels: [dependencies]
    schedule:
      interval: monthly
    groups:
      tauri:
        patterns: ['tauri*']
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    labels: [dependencies]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
