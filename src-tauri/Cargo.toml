[package]
name = "mnemax"
version = "0.1.0"
description = "Mnemax: dual n-back working-memory trainer"
authors = []
license = "AGPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mnemax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.4.5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
spake2 = "0.4"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
getrandom = "0.2"
qrcode = { version = "0.14", default-features = false }
if-addrs = "0.15"
zeroize = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-barcode-scanner = "2"

# Linux: lets the page open the camera to scan a pairing QR code (see allow_camera in src/lib.rs). The same
# version Tauri uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_8"] }

# The sync key's vault on computers: the system's key store (see src/sync/vault.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "4"
chacha20poly1305 = "0.11"
